name: Yonhap Media Personnel & Obituary Digest

on:
  schedule:
    # 목표: 08:40 KST(=UTC+9, 서머타임 없음) 평일 도착 = UTC 23:40 일~목요일 예약.
    # (KST 월요일 08:40은 UTC로는 전날인 일요일 23:40이라 cron 요일이 하루씩 밀립니다)
    #
    # 다만 GitHub Actions의 schedule 트리거는 UTC 자정(=한국시간 오전 9시) 부근에
    # 전 세계 예약 작업이 몰려 실제 실행이 지연되는 경우가 잦다(실사용 데이터로 확인함:
    # 23:40 UTC 예약 대비 실제 실행 00:02~00:04 UTC, 즉 22~24분 지연). 완벽히 없앨 수는
    # 없지만 20분 앞당겨(23:20 UTC = 08:20 KST) 예약해 그 지연을 보정한다. 스크립트의
    # 컷오프(08:40) 자체는 실행 시각과 무관하게 항상 정확하므로, 이 조정은 순수하게
    # "도착 시각"을 08:40에 더 가깝게 맞추기 위한 것이다.
    - cron: "20 23 * * 0-4"
  workflow_dispatch:
    inputs:
      target_date:
        description: "테스트용 기준 날짜 (YYYY-MM-DD). 비워두면 오늘 기준으로 실행."
        required: false
        type: string

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest script
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: python scripts/yonhap_digest.py

      # 파싱이 예상과 다를 때 원인을 확인할 수 있도록 원본 HTML을 항상 보관
      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html-${{ github.run_id }}
          path: debug/
          retention-days: 7
          if-no-files-found: ignore
